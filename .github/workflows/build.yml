name: Build & Test

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Run clang-format
        uses: cpp-linter/cpp-linter-action@v2
        with:
          style: file       # Use your .clang-format file
          version: 17       # Matches your local clang-format
          tidy-checks: ""   # Disable clang-tidy
          files-changed-only: false
          thread-comments: true

  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install and Setup Conan
        uses: conan-io/setup-conan@v1
        with:
            cache_packages: true

      - name: Detect Conan profile
        run: conan profile detect --force

      - name: Conan install
        run: conan install . --output-folder=build --build=missing -s build_type=Release

      - name: Configure
        run: cmake --preset release

      - name: Build
        run: cmake --build --preset release

      - name: Test
        run: ctest --test-dir build --output-on-failure