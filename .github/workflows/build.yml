name: Build & Test

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Conan
        run: pip install conan

      # IMPORTANT: create Conan profile
      - name: Detect Conan profile
        run: conan profile detect --force

      # IMPORTANT: install deps FIRST (this generates toolchain files)
      - name: Conan install
        run: conan install . --output-folder=build --build=missing -s build_type=Release

      # IMPORTANT: NOW configure CMake using preset
      - name: Configure
        run: cmake --preset release

      - name: Build
        run: cmake --build --preset release

      - name: Test
        run: ctest --test-dir build --output-on-failure